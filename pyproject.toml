[project]
name = "compute"
version = "0.2.0"
description = "/compute: pooled LLM inference split across Mac and Windows computers, metered in FLOPs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=14",
    "httpx>=0.27",
    "sqlmodel>=0.0.16",
    "pydantic>=2.6",
    "zeroconf>=0.131",
    "typer>=0.12",
    "psutil>=5.9",
    "python-multipart>=0.0.9",
    "pywebview>=5.0",
]

[project.scripts]
compute = "compute.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
build = [
    "pyinstaller>=6.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "tests/engine"]
markers = [
    "integration: multi-process end-to-end tests (slower)",
    "real_llama: needs real llama.cpp binaries and a GGUF model",
]
